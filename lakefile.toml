name = "minic-compiler"
defaultTargets = ["minic-compiler", "Parser"]
testDriver = "parserTests"

[[lean_lib]]
name = "Scanner"

[[lean_lib]]
name = "Automata"
roots = [
  "Automata.Common",
  "Automata.DFA",
  "Automata.NFA",
  "Automata.Simulation",
  "Automata.SimulationTactics",
  "Automata.Thompson",
  "Automata.Subset",
]

[[lean_lib]]
name = "Parser"

[[lean_lib]]
name = "GeneratedParser"

# Módulos de teste, importados por `Tests.Main` (raiz do exe `parserTests`).
[[lean_lib]]
name = "TestSuite"
roots = ["Tests", "Tests.Harness", "Tests.Syntax", "Tests.Programs"]

[[lean_exe]]
name = "minic-compiler"
root = "Main"

[[lean_exe]]
name = "parserTests"
root = "Tests.Main"

[[lean_exe]]
name = "gen-parser"
root = "GenMain"